name: Validate skills

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate every skill with agentskills-validate
        run: |
          fail=0
          for d in skills/*/; do
            npx --yes agentskills-validate@1.0.1 "$d" || fail=1
          done
          exit "$fail"

      - name: Plugin manifests and release version are consistent
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          plugin = json.loads(Path('.claude-plugin/plugin.json').read_text())
          marketplace = json.loads(Path('.claude-plugin/marketplace.json').read_text())
          assert plugin['name'] == marketplace['name'] == 'devops-skills'
          assert marketplace['owner']['name'] == 'abevz'
          assert len(marketplace['plugins']) == 1
          entry = marketplace['plugins'][0]
          assert entry['name'] == plugin['name']
          assert entry['source'] == './'
          assert plugin['skills'] == './skills/'
          version = plugin['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), version
          assert entry['version'] == version
          assert f'## [{version}] - ' in Path('CHANGELOG.md').read_text()
          count = len(list(Path('skills').glob('*/SKILL.md')))
          assert count > 0
          assert plugin['description'].startswith(f'{count} markdown-only skills ')
          assert entry['description'] == plugin['description']
          # Keep the package limited to declarative metadata and markdown skills.
          assert set(plugin) == {
              'name', 'version', 'description', 'author', 'homepage',
              'repository', 'license', 'keywords', 'skills',
          }
          assert set(entry) == {'name', 'source', 'version', 'description'}
          for path in ('hooks', 'agents', 'commands', 'scripts', '.mcp.json', '.lsp.json'):
              assert not Path(path).exists(), path
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          print(f'Plugin v{version}: {count} skills; manifests and release tag agree')
          PY

      - name: Every skill directory has exactly one SKILL.md
        run: |
          fail=0
          for d in skills/*/; do
            count=$(find "$d" -maxdepth 1 -name SKILL.md | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::$d has $count SKILL.md files (expected 1)"
              fail=1
            fi
          done
          exit $fail

      - name: Frontmatter is present and complete
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "::error file=$f::missing YAML frontmatter"
              fail=1
            fi
            for field in name description license compatibility; do
              if ! grep -q "^$field:" "$f"; then
                echo "::error file=$f::missing frontmatter field '$field'"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Frontmatter name matches directory name
        run: |
          fail=0
          for d in skills/*/; do
            dir=$(basename "$d")
            fname=$(awk -F': ' '/^name:/{print $2; exit}' "$d/SKILL.md")
            if [ "$dir" != "$fname" ]; then
              echo "::error file=$d/SKILL.md::frontmatter name '$fname' != directory '$dir'"
              fail=1
            fi
            if ! echo "$dir" | grep -qE '^[a-z0-9]+(-[a-z0-9]+)*$'; then
              echo "::error::directory '$dir' is not lowercase-hyphen-separated"
              fail=1
            fi
          done
          exit $fail

      - name: Description states a trigger
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            if ! grep -q '^description: Use when' "$f"; then
              echo "::error file=$f::description must start with 'Use when'"
              fail=1
            fi
          done
          exit $fail

      - name: Required sections are present
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            for section in 'When to use' 'Goal' 'Workflow' 'Safety rules' 'Output format' 'Quality checklist'; do
              if ! grep -q "^## $section" "$f"; then
                echo "::error file=$f::missing section '## $section'"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Reference files mentioned in SKILL.md exist
        run: |
          fail=0
          for d in skills/*/; do
            for r in $(grep -o 'references/[a-z0-9/-]*\.md' "$d/SKILL.md" 2>/dev/null | sort -u); do
              # cross-skill refs are written as <skill>/references/... and checked against skills/
              if [ ! -f "$d$r" ] && ! grep -o '[a-z-]*/references/[a-z0-9/-]*\.md' "$d/SKILL.md" | grep -q "$r"; then
                echo "::error file=$d/SKILL.md::dangling reference $r"
                fail=1
              fi
            done
            # verify cross-skill refs too
            for x in $(grep -o '[a-z-]*/references/[a-z0-9/-]*\.md' "$d/SKILL.md" 2>/dev/null | sort -u); do
              if [ ! -f "skills/$x" ]; then
                echo "::error file=$d/SKILL.md::dangling cross-skill reference $x"
                fail=1
              fi
            done
          done
          exit $fail

      - name: README table matches skills directories
        run: |
          grep -o '](skills/[a-z-]*)' README.md | sed 's|](skills/||;s|)||' | sort -u > /tmp/readme.txt
          ls skills/ | sort > /tmp/dirs.txt
          if ! diff -u /tmp/readme.txt /tmp/dirs.txt; then
            echo "::error::README skill table out of sync with skills/ directories"
            exit 1
          fi

      - name: No executable scripts or package manifests
        run: |
          found=$(find skills docs tests .github -type f \( -name '*.sh' -o -name '*.ps1' -o -name '*.js' -o -name '*.py' -o -name 'package.json' \) 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::executable scripts or package manifests found:"
            echo "$found"
            exit 1
          fi

      - name: No secrets or credential patterns
        run: |
          if grep -rEl 'AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|PGP) PRIVATE KEY|ghp_[A-Za-z0-9]{36}' skills/ docs/ README.md SECURITY.md CONTRIBUTING.md; then
            echo "::error::possible secret/credential pattern found"
            exit 1
          fi
